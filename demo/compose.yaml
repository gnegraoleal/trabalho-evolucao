services:
  postgres:
    image: postgres:17
    container_name: imarker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: imarker
      POSTGRES_USER: imarker
      POSTGRES_PASSWORD: imarker-local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imarker -d imarker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: imarker_postgres_data
