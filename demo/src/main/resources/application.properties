spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5433/imarker
spring.datasource.username=imarker
spring.datasource.password=imarker-local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# O projeto utiliza Hibernate ddl-auto=update. Não executar Flyway em paralelo.
spring.flyway.enabled=false
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_COOKIES_SECURE:false}
app.cookies.secure=${APP_COOKIES_SECURE:false}
app.admin.enabled=${ADMIN_ENABLED:false}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
